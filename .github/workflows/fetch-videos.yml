name: fetch-videos

on:
  schedule:
    - cron: "0 * * * *" # hourly (view counts refresh every run)
  workflow_dispatch:
    inputs:
      backfill:
        description: "Backfill full upload history (needs YOUTUBE_API_KEY secret)"
        type: boolean
        default: false
      status_limit:
        description: "Max oEmbed status checks this run"
        type: string
        default: "60"
      score_limit:
        description: "Max songs to score with Gemini AI this run"
        type: string
        default: "15"

permissions:
  contents: write

concurrency:
  group: fetch-videos
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Test
        run: npm test

      - name: Fetch videos
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          BACKFILL: ${{ github.event.inputs.backfill }}
          STATUS_LIMIT: ${{ github.event.inputs.status_limit }}
          EVENT: ${{ github.event_name }}
        run: |
          ARGS="--longform-feed"
          if [ "$BACKFILL" = "true" ]; then ARGS="$ARGS --backfill"; fi
          if [ -n "$STATUS_LIMIT" ]; then ARGS="$ARGS --status-limit $STATUS_LIMIT"; fi
          if [ "$EVENT" = "workflow_dispatch" ]; then ARGS="$ARGS --force-views"; fi
          node scripts/fetch-videos.mjs $ARGS

      - name: Score songs
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          SCORE_LIMIT: ${{ github.event.inputs.score_limit || '15' }}
        run: node scripts/score-songs.mjs

      - name: Commit data files if changed
        run: |
          if git diff --quiet data/videos.json data/ai-scores.json; then
            echo "No changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/videos.json data/ai-scores.json
          git commit -m "chore(data): update videos and ai-scores"
          git pull --rebase
          git push
